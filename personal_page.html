<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人網站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: #333;
            color: #fff;
            padding: 1rem 2rem;
            text-align: center;
        }
        nav ul {
            list-style: none;
            padding: 0;
        }
        nav li {
            display: inline-block;
            margin: 0 1rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
        }
        main {
            padding: 2rem;
        }
        footer {
            background: #f4f4f4;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>我的個人網站</h1>
        <nav>
            <ul>
                <li><a href="#about">關於我</a></li>
                <li><a href="#projects">作品集</a></li>
                <li><a href="#contact">聯絡方式</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>關於我</h2>
            <p>在這裡可以簡短介紹自己，像是興趣或專長。</p>
        </section>

        <section id="projects">
            <h2>作品集</h2>
            <p>列出你的專案或作品，可以附上連結。</p>
        </section>

        <section id="contact">
            <h2>聯絡方式</h2>
            <p>提供 Email 或社群媒體等聯絡資訊。</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 我的名字</p>
    </footer>
</body>
</html>
